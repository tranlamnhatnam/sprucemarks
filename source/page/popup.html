<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pine - Sắp xếp dấu trang</title>
    <link rel="stylesheet" href="/css/modern.css">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-family);
        }
        .popup-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .popup-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .popup-logo {
            width: 24px;
            height: 24px;
        }
        .popup-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .popup-version {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .popup-header-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            transition: all 0.15s ease;
        }
        .popup-header-btn:hover {
            color: var(--primary-blue);
            background-color: var(--nav-hover-bg);
        }
        .popup-header-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .popup-btn-sort {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25);
        }
        .popup-stats-strip {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            background-color: var(--bg-page);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            font-size: 12px;
        }
        .popup-stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }
        .popup-stat-num {
            font-weight: 700;
            color: var(--text-primary);
        }
        .popup-card {
            background-color: var(--bg-page);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .popup-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .popup-row-label {
            color: var(--text-primary);
            font-weight: 500;
        }
        .popup-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .popup-nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background-color: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .popup-nav-link:hover {
            color: var(--primary-blue);
            background-color: var(--primary-blue-light);
            border-color: var(--primary-blue);
        }
        .popup-nav-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="light">

    <div class="popup-container">
        <!-- Header -->
        <div class="popup-header">
            <div class="popup-brand">
                <svg class="popup-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="6" width="18" height="4" rx="2" fill="#F43F5E"/>
                    <rect x="4" y="14" width="24" height="4" rx="2" fill="#F59E0B"/>
                    <rect x="4" y="22" width="14" height="4" rx="2" fill="#3B82F6"/>
                    <circle cx="23" cy="24" r="2.5" fill="#3B82F6"/>
                </svg>
                <span class="popup-title">Pine</span>
                <span class="popup-version" id="popup-version">v2026.11.1</span>
            </div>
            <button type="button" class="popup-header-btn" id="btn-open-options" title="Mở trang cài đặt đầy đủ">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>

        <!-- Big Sort Button -->
        <button type="button" class="btn btn-primary popup-btn-sort btn-sort-now" id="btn-popup-sort">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            <span>Sắp xếp toàn bộ ngay</span>
        </button>

        <!-- Mini Stats Strip -->
        <div class="popup-stats-strip">
            <div class="popup-stat-item">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="#1a73e8"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <span class="popup-stat-num" id="popup-stat-bookmarks">---</span>
                <span>dấu trang</span>
            </div>
            <div style="color: var(--border-color)">•</div>
            <div class="popup-stat-item">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="#f59e0b"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span class="popup-stat-num" id="popup-stat-folders">---</span>
                <span>thư mục</span>
            </div>
        </div>

        <!-- Quick Toggles -->
        <div class="popup-card">
            <div class="popup-row">
                <span class="popup-row-label">Tự động sắp xếp</span>
                <label class="switch">
                    <input type="checkbox" id="popup-opt-auto-sort">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="popup-row">
                <span class="popup-row-label">Thư mục luôn ở trước</span>
                <label class="switch">
                    <input type="checkbox" id="popup-opt-group-folders">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Quick Navigation Grid -->
        <div class="popup-nav-grid">
            <a class="popup-nav-link" data-url="/page/options.html">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>Cơ bản</span>
            </a>
            <a class="popup-nav-link" data-url="/page/rules.html">
                <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                <span>Kiểu thư mục</span>
            </a>
            <a class="popup-nav-link" data-url="/page/tools-empty.html">
                <svg viewBox="0 0 24 24"><path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12z"/></svg>
                <span>Dọn dẹp rác</span>
            </a>
            <a class="popup-nav-link" data-url="/page/tools-replace.html">
                <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                <span>Tiện ích xử lý</span>
            </a>
            <a class="popup-nav-link" data-url="/page/stats.html">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                <span>Thống kê</span>
            </a>
            <a class="popup-nav-link" data-url="/page/sync.html">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                <span>Đồng bộ</span>
            </a>
        </div>
    </div>

    <script src="/js/browser-polyfill.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/page/pine-core.js"></script>
    <script src="/js/page/popup.js"></script>
</body>
</html>
